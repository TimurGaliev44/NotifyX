services:
  postgres:
    container_name: postgres
    image: postgres:16-bookworm
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
    networks:
       - backend

  redis:
    container_name: redis
    image: redis:7.2-alpine
    env_file:
      - .env
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - backend

  kafka:
    container_name: notifyx-kafka
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.2
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://kafka:29092,OUTSIDE://kafka:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "8083:8082"
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "info" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - kafka_data:/var/lib/redpanda/data
    networks:
      - backend

  check:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifyx-check
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend


networks:
  backend:
volumes:
  postgres_data:
  redis_data:
  kafka_data: